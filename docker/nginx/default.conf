server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000; #PHPはNginx自身では実行できないのでPHP-FPM（別プロセス）に処理を渡す
        fastcgi_index index.php; #PHPのデフォルトファイル
        include fastcgi_params; #Nginxが用意している「FastCGI用の共通設定ファイル」を読み込んでいる
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; #実行するPHPファイルを指定
    }
}